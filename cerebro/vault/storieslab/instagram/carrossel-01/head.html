<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500;1,9..144,600&display=block" rel="stylesheet">
<style>
@font-face{font-family:'Instrument Sans';src:url(src/instrument-sans.woff2) format('woff2');font-weight:400 700}
@font-face{font-family:'Instrument Serif';src:url(src/instrument-serif-italic.woff2) format('woff2');font-style:italic}
:root{--bg:#FFF7F5;--pink:#FF2E74;--pink-d:#D92B63;--soft:#FFD9E5;--ink:#2A1630;--muted:#806c7b}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:5400px;height:1350px;overflow:hidden;background:var(--bg)}
.c{position:relative;width:5400px;height:1350px;background:var(--bg);font-family:'Instrument Sans',sans-serif;color:var(--ink)}
.glow{position:absolute;border-radius:50%;filter:blur(120px);opacity:.55;background:#FFC9DA}
.serif{font-family:'Fraunces',Georgia,serif;letter-spacing:-.02em}
em{font-style:italic;color:var(--pink-d)}
.mk{background:linear-gradient(transparent 58%,var(--soft) 58%,var(--soft) 92%,transparent 92%);padding:0 .06em}
svg.thread{position:absolute;inset:0;pointer-events:none}
.story{position:absolute;width:380px;height:676px;border-radius:34px;overflow:hidden;transform:rotate(var(--r));
  box-shadow:0 2px 0 rgba(255,255,255,.6) inset,0 10px 22px rgba(42,22,48,.16),0 46px 90px rgba(42,22,48,.20),0 30px 80px rgba(255,46,116,.10);background:#ddd}
.story .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.story:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.38) 0,rgba(0,0,0,0) 22%,rgba(0,0,0,0) 78%,rgba(0,0,0,.32) 100%)}
.bars{position:absolute;top:14px;left:14px;right:14px;display:flex;gap:5px;z-index:3}
.bars i{flex:1;height:4px;border-radius:3px;background:rgba(255,255,255,.45)}
.bars i.on{background:#fff}
.who{position:absolute;top:30px;left:16px;display:flex;align-items:center;gap:10px;z-index:3;color:#fff;font-weight:600;font-size:19px;text-shadow:0 1px 4px rgba(0,0,0,.3)}
.who img{width:38px;height:38px;border-radius:50%;object-fit:cover;border:2px solid #fff}
.who span{font-weight:400;opacity:.8}
.stk{position:absolute;z-index:2;filter:drop-shadow(0 4px 10px rgba(0,0,0,.18))}
.reply{position:absolute;left:16px;right:76px;bottom:18px;height:50px;border:2px solid rgba(255,255,255,.75);border-radius:26px;z-index:3;color:#fff;font-size:18px;display:flex;align-items:center;padding-left:20px}
.heart{position:absolute;right:20px;bottom:24px;z-index:3;width:38px;height:38px}
.day{position:absolute;font-family:'Instrument Serif',serif;font-style:italic;font-size:92px;color:var(--pink);line-height:1;transform:rotate(var(--r))}
.txt{position:absolute}
.phone{position:absolute;width:390px;height:840px;border-radius:62px;background:#16121a;padding:14px;
  box-shadow:0 0 0 2px #3a3340 inset,0 14px 30px rgba(42,22,48,.22),0 60px 120px rgba(42,22,48,.26),0 40px 110px rgba(255,46,116,.14)}
.phone .scr{width:100%;height:100%;border-radius:49px;overflow:hidden;position:relative;background:#FBF6F2;padding-top:50px}
.phone .scr img{width:100%;display:block}
.phone .isl{position:absolute;top:28px;left:50%;transform:translateX(-50%);width:128px;height:36px;border-radius:20px;background:#000;z-index:2}
.btn{position:absolute;height:104px;border-radius:52px;background:var(--pink);color:#fff;font-weight:600;font-size:38px;display:flex;align-items:center;justify-content:center;gap:16px;
  box-shadow:0 14px 34px rgba(255,46,116,.35),0 2px 0 rgba(255,255,255,.35) inset}
</style></head><body>
