<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Brico;src:url(bricolage-grotesque-v2.woff2);font-weight:600 800}
@font-face{font-family:Pac;src:url(pacifico.woff2)}
@font-face{font-family:IS;src:url(instrument-serif-italic.woff2);font-style:italic}
*{box-sizing:border-box;margin:0}html,body{width:600px;height:600px;overflow:hidden}
body{position:relative;font-family:Brico;color:#2A1630;background:#FBE4EB}
.lab{position:absolute;left:0;right:0;bottom:44px;text-align:center;font-weight:800;font-size:82px;letter-spacing:-.04em;line-height:1}
.lab em{font-family:IS;font-weight:400;font-style:italic;color:#D92B63;letter-spacing:-.01em}
.top{position:absolute;left:0;right:0;top:56px;height:380px;display:grid;place-items:center}
/* presets */
.ba{width:420px;height:330px;border-radius:36px;overflow:hidden;position:relative;box-shadow:0 20px 50px rgba(42,22,48,.25)}
.ba img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ba .d{clip-path:inset(0 0 0 50%)}
.ba i{position:absolute;left:50%;top:0;bottom:0;width:6px;margin-left:-3px;background:#fff}
.ba i:after{content:"";position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px;border-radius:50%;background:#fff}
/* fontes */
.aa{font-family:Pac;font-size:250px;line-height:1;color:#D92B63;transform:rotate(-6deg)}
/* seguidores */
.av{width:250px;height:250px;border-radius:50%;padding:10px;background:conic-gradient(#D92B63,#FFD84D,#D92B63);position:relative}
.av img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:9px solid #FBE4EB}
.pill{position:absolute;right:-70px;bottom:6px;background:#D92B63;color:#fff;font-weight:800;font-size:54px;padding:10px 26px;border-radius:999px;box-shadow:0 12px 30px rgba(217,43,99,.35)}
/* reels */
.ph{width:230px;height:380px;border-radius:40px;overflow:hidden;position:relative;box-shadow:0 20px 50px rgba(42,22,48,.25)}
.ph img{width:100%;height:100%;object-fit:cover}
.ph b{position:absolute;left:50%;top:50%;width:110px;height:110px;margin:-55px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center}
.ph b:after{content:"";margin-left:12px;border-left:44px solid #D92B63;border-top:28px solid transparent;border-bottom:28px solid transparent}
</style></head><body><div class="top" id="t"></div><div class="lab" id="l"></div><script>
const k=new URLSearchParams(location.search).get('k');
const C={
presets:[`<div class="ba"><img src="pa.jpg"><img class="d" src="pd.jpg"><i></i></div>`,`Obra de <em>arte</em>`],
letras:[`<div class="aa">Aa</div>`,`Suas <em>fontes</em>`],
perfil:[`<div class="av"><img src="selfie-carro-02.jpg"><span class="pill">+ 1.240</span></div>`,`Seguidores`],
reels:[`<div class="ph"><img src="bolo-caseiro-05.jpg"><b></b></div>`,`60 <em>Reels</em>`]};
document.getElementById('t').innerHTML=C[k][0];document.getElementById('l').innerHTML=C[k][1];
</script></body></html>
