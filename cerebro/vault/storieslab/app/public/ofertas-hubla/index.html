<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Ofertas opcionais — Stories Lab</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fbf7f4;color:#2a1630;font-family:Arial,sans-serif}a{color:inherit}header{max-width:1020px;margin:auto;padding:28px 24px;display:flex;justify-content:space-between;align-items:center}.logo{font:bold 27px Georgia;letter-spacing:-1.5px}.logo i{color:#ed2469;font-weight:400}.logo:before{content:'';display:inline-block;width:17px;height:25px;background:linear-gradient(135deg,#ff2e74 78%,#ffd84d 78%);border-radius:5px 5px 9px 5px;margin-right:8px;vertical-align:middle}.optional{font-size:12px;color:#806b80}main{max-width:1020px;margin:32px auto;padding:0 24px 40px;display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center}.eyebrow{color:#b82660;letter-spacing:.14em;text-transform:uppercase;font-size:11px;font-weight:700}h1{font:500 clamp(36px,5vw,56px)/1.06 Georgia;letter-spacing:-1.8px;margin:17px 0}p{font-size:16px;line-height:1.6;color:#776475}.description{max-width:410px}ul{padding:0;list-style:none;margin:28px 0}li{font-size:14px;line-height:1.55;margin:14px 0;padding-left:25px;position:relative}li:before{content:'✓';position:absolute;left:0;color:#168b5b;font-weight:bold}.card{padding:36px;background:white;border:1px solid #e9dfe6;border-radius:26px;box-shadow:0 18px 60px #52244309}.label{font-size:13px;color:#796779}.price{font-size:56px;font-weight:700;letter-spacing:-3px;margin:18px 0 4px}.price small{font-size:22px;letter-spacing:0}.once{font-size:12px;margin:0}.old{font-size:15px;margin:22px 0 -12px;color:#927f90}.buy{display:block;background:#148b5a;color:white;border-radius:14px;text-align:center;padding:19px 12px;font-size:16px;font-weight:700;text-decoration:none;margin-top:28px}.buy:hover{background:#107348}.decline{display:block;width:100%;border:0;background:none;color:#806b80;font-size:13px;text-decoration:underline;padding:20px 5px;cursor:pointer}.notice{font-size:11px;line-height:1.55;color:#8f7a89;margin:0}.detail{padding-top:24px;margin-top:20px;border-top:1px solid #f0e8ed;display:flex;gap:12px;font-size:10px;color:#8b7988}.footer{text-align:center;font-size:11px;color:#8f7d8d;padding:20px 24px 35px}.tag{background:#fdeaf0;color:#b62b5e;display:inline-block;font-size:11px;font-weight:bold;padding:8px 11px;border-radius:30px}.skip{font-size:12px;background:none;border:0;color:#836e80;padding:0;cursor:pointer;text-decoration:underline}.preview{background:#fff1d7;text-align:center;padding:10px;font-size:12px;color:#6a4c15}.done{display:block;max-width:620px;text-align:center;margin:70px auto}.done .buy{max-width:330px;margin:30px auto}.done p{font-size:15px}a:focus-visible,button:focus-visible{outline:3px solid #ed2469;outline-offset:4px}@media(max-width:680px){header{padding:24px 22px}.logo{font-size:24px}.optional{font-size:10px}main{display:block;margin:15px auto;padding:0 22px}h1{font-size:40px}.description{font-size:15px}ul{margin:22px 0}.card{padding:27px;margin:30px 0 20px}.price{font-size:49px}.done{margin:40px auto;padding:0 24px}.detail{justify-content:center}}
</style></head><body><div class="preview" id="preview" hidden>Prévia de revisão · compras desabilitadas</div><header><div class="logo">stories<i>lab</i></div><span class="optional">Ofertas opcionais</span></header><main id="content" aria-live="polite"></main><footer class="footer">@storieslab.app · <a href="https://storieslab.app/suporte">Precisa de ajuda?</a></footer>
<script type="module">
import {stage,decline,buyUrl} from './flow.mjs';
const q=new URLSearchParams(location.search), preview=location.hostname==='localhost'||location.hostname==='127.0.0.1'||location.hostname.endsWith('.vercel.app')||q.has('preview');
document.querySelector('#preview').hidden=!preview;
let features=[];
// Read only from a signed app session; URL parameters never grant app access.
if(!preview)try{const r=await fetch('/api/funnel-state',{credentials:'same-origin',cache:'no-store'});if(r.ok){const d=await r.json();if(d.ok&&Array.isArray(d.features))features=d.features}}catch{}
const money=n=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(n);
function render(){const query=new URLSearchParams(location.search), current=stage(query.get('step')||'personalizadas',query.get('special')==='1',features), box=document.querySelector('#content');
const originalPages = {personalizadas:'/upsell-marca/', kit:'/upsell2/', presets:'/upsell/presets.html'};
if (!preview && current && originalPages[current.product.key]) {
  const destination = new URL(originalPages[current.product.key], 'https://storieslab.shop');
  destination.search = query.toString();
  destination.searchParams.delete('step');
  if (current.special) destination.searchParams.set('special','1');
  else destination.searchParams.delete('special');
  location.replace(destination.href);
  return;
}
if(!current){box.className='done';box.innerHTML='<span class="eyebrow">Continue no aplicativo</span><h1>Agora é com você.</h1><p>Entre com o mesmo e-mail usado na compra. Os produtos aprovados aparecem na sua conta.</p><a class="buy" href="https://app.storieslab.shop/acessar.html">Acessar Stories Lab →</a><p class="notice">Se um pagamento ainda estiver pendente, aguarde a confirmação da Hubla.</p>';return}
const p=current.product, price=current.special?p.special:p.price;
box.className='';box.innerHTML=`<section><span class="eyebrow">${p.eyebrow}</span><h1>${p.name}</h1><p class="description">${p.description}</p><ul>${p.points.map(t=>'<li>'+t+'</li>').join('')}</ul><button class="skip" type="button" id="owned">Já tenho este produto</button></section><section class="card"><span class="tag">${current.special?'Condição especial':'Adicione ao seu acesso'}</span>${current.special?'<p class="old">De <s>'+money(p.price)+'</s></p>':''}<div class="price"><small>R$</small> ${price.toFixed(2).replace('.',',')}</div><p class="once">Pagamento único · sem mensalidade</p><a class="buy" id="buy">Comprar por ${money(price)} →</a><button class="decline" id="decline" type="button">Não, obrigada. Continuar</button><p class="notice">Esta é uma compra adicional. Confira o valor antes de confirmar na Hubla. Os recursos que você já possui continuam disponíveis.</p><div class="detail"><span>Pagamento pela Hubla</span><span>Acesso pelo e-mail da compra</span></div></section>`;
const attrs=Object.fromEntries(['utm_source','utm_medium','utm_campaign','utm_content','utm_term','src'].filter(k=>q.get(k)).map(k=>[k,q.get(k)]));
const buy=box.querySelector('#buy');if(preview){buy.href='#';buy.addEventListener('click',e=>{e.preventDefault();buy.textContent='Prévia: nenhuma cobrança realizada'})}else buy.href=buyUrl(current,attrs);
function go(step,special){const u=new URL(location.href);u.searchParams.set('step',step);if(special)u.searchParams.set('special','1');else u.searchParams.delete('special');history.pushState(null,'',u);render();window.scrollTo(0,0)}
box.querySelector('#decline').onclick=()=>{const n=decline(current,features);go(n.step,n.special)};
box.querySelector('#owned').onclick=()=>{features.push(...(p.key==='kit'?['agenda','presets','animadas']:[p.feature]));const n=stage(p.key,false,features);go(n?.product.key||'done',false)};
}window.addEventListener('popstate',render);render();
</script></body></html>
